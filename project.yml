# XcodeGen project spec (https://github.com/yonaskolb/XcodeGen). The generated
# .xcodeproj is never committed (see .gitignore): `xcodegen generate`
# regenerates it deterministically from this file, in CI and on a developer
# machine alike. Directory paths under `sources:` are globs, so a new file in
# an existing directory needs no change here; only a new top-level source
# directory does.
name: StarterAppIOS
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  StarterAppIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/StarterAppIOS
    info:
      path: Sources/StarterAppIOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: Starter App
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UIApplicationSupportsIndirectInputEvents: true
    entitlements:
      path: Sources/StarterAppIOS/Resources/StarterAppIOS.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.starterapp
        # Do NOT override PRODUCT_NAME away from the target name: Xcode derives
        # the unit-test bundle's TEST_HOST path from the app target's name, and a
        # diverging PRODUCT_NAME breaks that ("Could not find test host").
        # CFBundleDisplayName above is the user-visible app name.
        #
        # Ad-hoc ("-") signing, not CODE_SIGNING_ALLOWED=NO: an unsigned build
        # launches in the Simulator, but Keychain entitlement checks fail with
        # errSecMissingEntitlement (-34018) without at least ad-hoc signing, which
        # needs no paid Apple Developer account for Simulator destinations.
        # Replace with your team and a real signing setup for device builds.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets:
        - StarterAppIOSTests
      gatherCoverageData: true

  StarterAppIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/StarterAppIOSTests
    dependencies:
      - target: StarterAppIOS
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
        # Ad-hoc signing requires every signed target to have an Info.plist to
        # embed; let Xcode generate a minimal one for the test bundle.
        GENERATE_INFOPLIST_FILE: YES
